aid: hevn-inc
name: Hevn Inc
description: >-
  HEVN Inc (Y Combinator S26) is a fintech platform that lets non-US companies
  operate in USD without a US entity. It opens named virtual business accounts
  with sponsor banks across the US, Europe, the UK, the UAE, Latin America, and
  Puerto Rico, issues zero-FX USD business cards, and moves money across ACH,
  SEPA, SWIFT, and UAE FTS rails as well as USDC stablecoin rails on Base. HEVN
  is agent-first: its REST API, first-party CLI (hevn-cli), and hosted MCP
  server expose account, contact, transfer, invoice, contract, card, and KYB
  operations to AI coding agents, guarded by per-API-key spend permissions and
  idempotency keys.
