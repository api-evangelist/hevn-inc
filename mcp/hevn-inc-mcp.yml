server:
  name: hevn
  transport: stdio
  install: hevn mcp install
  serve: hevn mcp serve
  description: >-
    HEVN ships a first-party MCP server through its CLI. `hevn mcp install`
    wires the HEVN command surface into MCP coding agents (Claude Code, Codex,
    Cursor); `hevn mcp serve` runs the server. The MCP tool surface maps to the
    dedicated /api/v1/mcp/* operations in the HEVN API, authenticated with a
    HEVN API key (hvn_...). Money-movement tools are guarded by user spend
    permissions.
