          $ref: '#/components/schemas/ContractType'
          default: service
        period:
          anyOf:
          - $ref: '#/components/schemas/ContractPeriod'
          - type: 'null'
        activationAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Activationat
        expirationAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expirationat
