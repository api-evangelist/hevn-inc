        Exactly one of ``contractor_email`` or ``client_email`` must be set.

        * ``contractor_email`` — the creator is the **client**.

        * ``client_email`` — the creator is the **contractor**.'
    TemplateListResponse:
      properties:
        templates:
          items:
            $ref: '#/components/schemas/TemplateDescriptor'
          type: array
          title: Templates
      type: object
      required:
      - templates
      title: TemplateListResponse
      description: List of fillable document templates.
    TemplateField:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        type:
          $ref: '#/components/schemas/TemplateFieldType'
          default: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        required:
          type: boolean
          title: Required
          default: false
        multiline:
          type: boolean
          title: Multiline
          default: false
        source:
          $ref: '#/components/schemas/TemplateFieldSource'
          default: user
        party:
          anyOf:
          - type: string
            enum:
            - client
            - contractor
          - type: 'null'
          title: Party
        options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Options
        fields:
          anyOf:
          - items:
              $ref: '#/components/schemas/TemplateField'
            type: array
          - type: 'null'
          title: Fields
        item:
          anyOf:
          - $ref: '#/components/schemas/TemplateField'
          - type: 'null'
      type: object
      required:
      - key
      - label
      title: TemplateField
      description: 'Single field of a document template, for dynamic discovery.


        Clients should prompt the user for ``USER`` fields, and for ``PROFILE`` fields only

        when the referenced party''s value is not already available. ``required`` means the

        final document needs a non-empty value, regardless of who provides it.


        Descriptors are built from a template''s annotated input model by

        ``TemplateFieldBuilder``; composite fields nest their shape in :attr:`fields`

        (objects), :attr:`item` (arrays) or :attr:`options` (enums).'
  securitySchemes:
    HTTPBearer:
