components:
  schemas:
    TemplateDescriptor:
      properties:
        type:
          $ref: '#/components/schemas/ContractDocumentTemplateType'
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        requiresDocument:
          type: boolean
          title: Requiresdocument
          default: false
        supportsContractGeneration:
          type: boolean
          title: Supportscontractgeneration
          default: false
        supportsInvoicing:
          type: boolean
          title: Supportsinvoicing
          default: false
        fields:
          items:
            $ref: '#/components/schemas/TemplateField'
          type: array
          title: Fields
      type: object
      required:
      - type
      - title
      - description
      title: TemplateDescriptor
      description: Describes a document template and the fields a client must fill.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ServiceContractPreviewFields:
      properties:
        effectiveDate:
          type: string
          title: Effectivedate
        clientName:
          type: string
          title: Clientname
        serviceProviderName:
          type: string
          title: Serviceprovidername
        services:
          type: string
          title: Services
        paymentTerms:
          type: string
          title: Paymentterms
        invoiceCycle:
          type: string
          title: Invoicecycle
        paymentDue:
          type: string
          title: Paymentdue
        confidentialityTerms:
          type: string
          title: Confidentialityterms
        intellectualPropertyTerms:
          type: string
          title: Intellectualpropertyterms
      type: object
      required:
      - effectiveDate
      - clientName
      - serviceProviderName
      - services
      - paymentTerms
      - invoiceCycle
      - paymentDue
      - confidentialityTerms
      - intellectualPropertyTerms
      title: ServiceContractPreviewFields
    UpdateContractLabelRequest:
      properties:
        label:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Label
      type: object
      title: UpdateContractLabelRequest
      description: Request to update a contract label.
    TemplateFieldSource:
      type: string
      enum:
      - user
      - profile
      - computed
      - default
      title: TemplateFieldSource
      description: "Where a template field's value comes from.\n\n* ``USER`` — must be entered by the user.\n* ``PROFILE`` — taken from a party's profile when available; if the profile is\n  incomplete or the party is not registered yet, it must be collected from the user.\n* ``COMPUTED`` — generated server-side (current date, reference, derived legal terms).\n* ``DEFAULT`` — filled with a boilerplate default; no input required."
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ContractStatus:
      type: string
      enum:
      - pending_approval_by_contractor
      - pending_approval_by_client
      - active
      - completed
      - cancelled
      - paused
      title: ContractStatus
      description: Contract status.
    Currency:
      type: string
      enum:
      - USD
      - EUR
      - GBP
      - JPY
      - CHF
      - CAD
      - AUD
      - NZD
      - SEK
      - NOK
      - AED
      - HKD
      title: Currency
      description: Supported invoice/contract currencies. G10 majors + AED/HKD.
    GenerateScopePrefillRequest:
      properties:
