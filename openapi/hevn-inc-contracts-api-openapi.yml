    CreateContractRequest:
      properties:
        contractorEmail:
          anyOf:
          - type: string
            maxLength: 320
            minLength: 3
          - type: 'null'
          title: Contractoremail
        clientEmail:
          anyOf:
          - type: string
            maxLength: 320
            minLength: 3
          - type: 'null'
