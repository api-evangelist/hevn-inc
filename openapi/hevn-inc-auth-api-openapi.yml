openapi: 3.2.0
info:
  title: HEVN Platform Auth API
  description: 'HEVN''s account, verification and money-movement API. Verification follows a submission workflow: save applicant info and documents, inspect outstanding requirements, then explicitly complete the submission to send an immutable snapshot for review. Completing a submission is separate from editing it.'
  version: 1.0.0
tags:
- name: Auth
  description: Authenticate an integration and issue short-lived account sessions.
paths:
  /auth/challenge:
    post:
      tags:
      - Auth
      summary: Start a developer-key login and receive the payload to sign
      description: Start developer-key authentication. Sign the returned payload with the registered key and exchange it once through `POST /auth/token` before it expires.
      operationId: start_challenge_auth_challenge_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /auth/token:
    post:
      tags:
      - Auth
      summary: Exchange a signed login challenge for a session
      description: Exchange a signed, unexpired challenge for an access token and refresh token. A challenge is consumed once; replay, a different key or a different account is refused.
      operationId: mint_token_auth_token_post
      security:
      - HTTPBearer: []
      parameters:
      - name: device-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device-Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: user-agent
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User-Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ChallengeTokenRequest'
              - $ref: '#/components/schemas/ProofTokenRequest'
              title: Data
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Exchange a refresh token for a session, optionally acting for an account
      description: Exchange a device-bound refresh token for a new short-lived access token. `userId` may select an account the authenticated actor is currently authorized to access.
      operationId: refresh_session_auth_refresh_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: user-agent
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User-Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
components:
  schemas:
    ChallengeResponse:
      properties:
        challengeId:
          type: string
          format: uuid
          title: Challengeid
          description: Single-use authentication challenge identifier.
        payload:
          type: string
          title: Payload
          description: Base64-encoded canonical authorization payload the developer key must sign.
        expiresAt:
          type: string
          format: date-time
          title: Expiresat
          description: UTC timestamp after which the challenge is refused.
      type: object
      required:
      - challengeId
      - payload
      - expiresAt
      title: ChallengeResponse
    TokenResponse:
      properties:
        accessToken:
          type: string
          title: Accesstoken
          description: Short-lived bearer token used to authorize API requests.
        refreshToken:
          type: string
          title: Refreshtoken
          description: Long-lived device-bound token used only at POST /dapi/v1/auth/refresh.
        expiresIn:
          type: integer
          title: Expiresin
          description: Number of seconds until the access token expires.
        userId:
          type: string
          pattern: ^(?:cl_)?[A-Za-z0-9._:\-]{1,216}$
          title: Userid
          description: Account selected for the issued session.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      - userId
      title: TokenResponse
    ChallengeRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: Email address of the account that owns the registered developer key.
        publicKey:
          type: string
          title: Publickey
          description: Base64 DER SubjectPublicKeyInfo for the registered P-256 developer key.
        nonce:
          type: integer
          title: Nonce
          description: Caller-generated single-use number included in the signed authentication proof.
        requestExpiry:
          type: integer
          title: Requestexpiry
          description: Unix time in milliseconds after which the signed request is refused.
        signature:
          type: string
          title: Signature
          description: Base64 DER ECDSA P-256/SHA-256 signature over the login proof message.
      additionalProperties: false
      type: object
      required:
      - email
      - publicKey
      - nonce
      - requestExpiry
      - signature
      title: ChallengeRequest
    SessionResponse:
      properties:
        accessToken:
          type: string
          title: Accesstoken
          description: Short-lived bearer token used to authorize API requests.
        expiresIn:
          type: integer
          title: Expiresin
          description: Number of seconds until the access token expires.
        userId:
          type: string
          pattern: ^(?:cl_)?[A-Za-z0-9._:\-]{1,216}$
          title: Userid
          description: Account selected for the issued session.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
      type: object
      required:
      - accessToken
      - expiresIn
      - userId
      title: SessionResponse
    PlatformErrorCode:
      type: string
      enum:
      - invalid_request
      - validation_failed
      - invalid_cursor
      - invalid_id
      - idempotency_key_invalid
      - idempotency_key_reused
      - unauthenticated
      - token_expired
      - forbidden
      - not_found
      - method_not_allowed
      - conflict
      - gone
      - payload_too_large
      - rate_limited
      - provider_unavailable
      - database_unavailable
      - internal_error
      - invalid_credentials
      - request_expired
      - challenge_not_found
      - challenge_consumed
      - challenge_expired
      - signature_invalid
      - key_not_registered
      - signer_not_attached
      - wallet_not_linked
      - approval_consumed
      - approval_expired
      - approval_mismatch
      - signing_policy_refused
      - login_unavailable
      - login_mode_unavailable
      - developer_key_not_found
      - developer_key_already_exists
      - account_header_invalid
      - account_scope_conflict
      - account_not_found
      - account_forbidden
      - account_read_only
      - account_not_controlled
      - contact_not_found
      - quote_not_submitted
      - quote_not_fundable
      - funding_mode_unsupported
      - funding_token_unsupported
      - insufficient_funds
      - smart_wallet_not_deployed
      - wallet_owner_unverified
      - already_funded
      - payment_slot_consumed
      - funding_in_progress
      - funding_attempt_expired
      - contact_changed
      - user_operation_rejected
      - user_operation_unavailable
      - transfer_policy_denied
      - integrator_inactive
      - client_creation_not_enabled
      - client_policy_not_enabled
      - email_in_use
      - name_in_use
      - client_request_conflict
      - client_not_found
      - profile_locked
      - contact_not_payable
      - contact_chain_unsupported
      - contact_token_unsupported
      - contact_payment_details_invalid
      - amount_below_minimum
      - amount_above_maximum
      - amount_precision_unsupported
      - payout_not_found
      - payout_not_fundable
      - quote_expired
      - bundler_rejected
      - bundler_unavailable
      - contact_details_invalid
      - contact_in_use
      - kyb_incomplete
      - kyb_roster_conflict
      - kyb_subject_conflict
      - document_fields_missing
      - document_not_found
      - document_type_unsupported
      - invalid_enum_value
      - entity_not_found
      - escrow_not_found
      - escrow_action_not_found
      - escrow_not_operated_by_you
      - escrow_state_changed
      - action_in_flight
      - simulation_failed
      - stale_nonce
      - amount_out_of_range
      - amount_not_allowed
      - window_closed
      - token_not_supported
      - receiver_not_a_client
      - rail_not_found
      - rail_not_available
      - rail_requirements_unmet
      - phone_required
      - payin_not_available
      - payin_expired
      - payin_not_found
      - transaction_not_found
      - account_unavailable
      - account_not_supported
      - swap_not_found
      - swap_route_unavailable
      - swap_not_confirmable
      - intent_not_signable
      title: PlatformErrorCode
    RefreshRequest:
      properties:
        userId:
          anyOf:
          - type: string
            pattern: ^(?:cl_)?[A-Za-z0-9._:\-]{1,216}$
            examples:
            - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          - type: 'null'
          title: Userid
          description: Account to act for; omit it to continue acting as the authenticated account.
      additionalProperties: false
      type: object
      title: RefreshRequest
    ChallengeTokenRequest:
      properties:
        challengeId:
          type: string
          format: uuid
          title: Challengeid
          description: Single-use challenge identifier returned by POST /dapi/v1/auth/challenge.
        signature:
          type: string
          title: Signature
          description: Signature over the decoded payload returned for this challenge.
        publicKey:
          anyOf:
          - type: string
          - type: 'null'
          title: Publickey
          description: Registered P-256 public key; omit when the signature uniquely identifies the key.
      additionalProperties: false
      type: object
      required:
      - challengeId
      - signature
      title: ChallengeTokenRequest
    ProofTokenRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: Email address of the account that owns the registered developer key.
        publicKey:
          type: string
          title: Publickey
          description: Base64 DER SubjectPublicKeyInfo for the registered P-256 developer key.
        nonce:
          type: integer
          title: Nonce
          description: Caller-generated single-use number included in the signed authentication proof.
        requestExpiry:
          type: integer
          title: Requestexpiry
          description: Unix time in milliseconds after which the signed request is refused.
        signature:
          type: string
          title: Signature
          description: Base64 DER ECDSA P-256/SHA-256 signature over the login proof message.
      additionalProperties: false
      type: object
      required:
      - email
      - publicKey
      - nonce
      - requestExpiry
      - signature
      title: ProofTokenRequest
    PlatformErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/PlatformErrorBody'
          description: Public error body.
      type: object
      required:
      - error
      title: PlatformErrorResponse
    PlatformErrorBody:
      properties:
        code:
          $ref: '#/components/schemas/PlatformErrorCode'
          description: Stable machine-readable error code.
        message:
          type: string
          title: Message
          description: Human-readable explanation safe to show to an end user.
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
          description: Structured context for this error, when available.
      type: object
      required:
      - code
      - message
      title: PlatformErrorBody
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
