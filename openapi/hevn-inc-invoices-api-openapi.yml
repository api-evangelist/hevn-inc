      summary: Get invoice by ID
      operationId: get_invoice_api_v1_documents_contracts_invoices__invoice_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invoice Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
