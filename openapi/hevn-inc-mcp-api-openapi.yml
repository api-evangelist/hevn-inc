components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    app__schemas__routers__security__mcp__ApiKeyResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        key:
          type: string
          title: Key
        walletAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Walletaddress
        ipRestriction:
          anyOf:
          - type: string
          - type: 'null'
          title: Iprestriction
        maxSpend:
          anyOf:
          - type: number
          - type: 'null'
          title: Maxspend
        totalSpend:
          type: number
          title: Totalspend
        remaining:
          type: integer
          title: Remaining
          default: 0
        lastUse:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Lastuse
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - name
      - key
      - totalSpend
      - createdAt
      title: ApiKeyResponse
    McpTransactionResponse:
      properties:
        txHash:
          type: string
          title: Txhash
        amount:
          anyOf:
          - type: number
          - type: 'null'
          title: Amount
        receiverEmail:
          anyOf:
          - type: string
          - type: 'null'
          title: Receiveremail
        receiverAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Receiveraddress
        transactionLink:
          anyOf:
          - type: string
          - type: 'null'
          title: Transactionlink
        time:
          type: string
          format: date-time
          title: Time
      type: object
      required:
      - txHash
      - time
      title: McpTransactionResponse
    ApiKeyListResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        keyPreview:
          type: string
          title: Keypreview
        walletAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Walletaddress
        ipRestriction:
          anyOf:
          - type: string
          - type: 'null'
          title: Iprestriction
        maxSpend:
          anyOf:
          - type: number
          - type: 'null'
          title: Maxspend
        totalSpend:
          type: number
          title: Totalspend
        remaining:
          type: integer
          title: Remaining
          default: 0
        lastUse:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Lastuse
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - name
      - keyPreview
      - totalSpend
      - createdAt
      title: ApiKeyListResponse
    BalanceResponse:
      properties:
        email:
          type: string
          title: Email
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        balance:
          type: number
          title: Balance
          default: 0
        remaining:
          type: number
          title: Remaining
          default: 0
      type: object
      required:
      - email
      title: BalanceResponse
    TransferRequest:
      properties:
        amount:
          type: number
          title: Amount
        email:
          type: string
          title: Email
        memo:
          anyOf:
          - type: string
          - type: 'null'
          title: Memo
      type: object
      required:
      - amount
      - email
      title: TransferRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TransferResponse:
      properties:
        txHash:
          anyOf:
          - type: string
          - type: 'null'
          title: Txhash
        userCreated:
          type: boolean
          title: Usercreated
          default: false
        emailSent:
          type: boolean
          title: Emailsent
          default: false
      type: object
      title: TransferResponse
    app__schemas__routers__security__mcp__ApiKeyCreateRequest:
      properties:
        name:
          type: string
          title: Name
        ipRestriction:
          anyOf:
          - type: string
          - type: 'null'
          title: Iprestriction
        maxSpend:
          anyOf:
          - type: number
          - type: 'null'
          title: Maxspend
      type: object
      required:
      - name
      title: ApiKeyCreateRequest
    McpTransferContext:
      properties:
        contactId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Contactid
        quoteId:
          anyOf:
          - type: string
          - type: 'null'
          title: Quoteid
        invoiceId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Invoiceid
        amount:
          anyOf:
          - type: number
          - type: 'null'
          title: Amount
        memo:
          anyOf:
          - type: string
          - type: 'null'
          title: Memo
      type: object
      title: McpTransferContext
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      x-default: Bearer <token>
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Alternative HEVN API key header. The CLI defaults to Authorization Bearer unless configured with HEVN_API_KEY_HEADER=X-Api-Key.
