      - rail_not_available
      - rail_requirements_unmet
      - phone_required
      - payin_not_available
      - payin_expired
      - payin_not_found
      - transaction_not_found
      - account_unavailable
      - account_not_supported
      - swap_not_found
      - swap_route_unavailable
      - swap_not_confirmable
      - intent_not_signable
      title: PlatformErrorCode
    PlatformErrorBody:
      properties:
        code:
          $ref: '#/components/schemas/PlatformErrorCode'
          description: Stable machine-readable error code.
        message:
          type: string
          title: Message
          description: Human-readable explanation safe to show to an end user.
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
          description: Structured context for this error, when available.
      type: object
      required:
      - code
      - message
      title: PlatformErrorBody
    DocumentResponse:
      properties:
        id:
          type: string
          pattern: ^(?:doc_)?[A-Za-z0-9._:\-]{1,216}$
          title: Id
          description: Stable public identifier for this document.
          examples:
          - doc_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
        slot:
          $ref: '#/components/schemas/DocumentType'
          description: Verification requirement this document satisfies.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Human-readable document name.
        fileName:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
          description: Original file name including its extension.
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
          description: UTC timestamp when the document was created.
      type: object
      required:
      - id
      - slot
      title: DocumentResponse
    PlatformErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/PlatformErrorBody'
          description: Public error body.
      type: object
      required:
      - error
      title: PlatformErrorResponse
    DocumentUploadRequest:
      properties:
        slot:
          $ref: '#/components/schemas/DocumentType'
          description: Verification requirement this file satisfies.
        content:
          type: string
          minLength: 1
          title: Content
          description: Base64-encoded document bytes.
        fileName:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Filename
          description: Original file name including its extension.
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
          description: Human-readable document name.
      additionalProperties: false
      type: object
      required:
      - slot
      - content
      title: DocumentUploadRequest
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
