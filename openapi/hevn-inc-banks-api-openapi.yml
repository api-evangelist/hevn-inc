    IBANStatus:
      type: string
      enum:
      - not_started
      - requested
      - document_requested
      - approved
      - pending_kyc
      - pending
      - active
      - hidden
      - frozen
      - closed
      - rejected
      title: IBANStatus
      description: 'IBAN account status.


        State machine:

        ``not_started`` → ``requested`` → ``document_requested`` → ``approved`` → ``pending`` → ``active``


        - ``not_started``       — default for every rail until the user opts in.

        - ``requested``         — user asked for this rail via /pre-approve; awaiting KYC.

        - ``document_requested``— admin asked the user for more documents (KYB).

        - ``approved``          — KYB passed, account ready to be created at provider.

        - ``pending_kyc``       — provider rejected creation until KYC is approved.

        - ``pending``           — provider accepted/created the account, waiting.

        - ``active``            — real bank details are attached to the row.

        - ``frozen`` / ``closed``— terminal/blocked states.'
    BankPreApproveResponse:
      properties:
        kycUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Kycurl
        kycStatus:
          $ref: '#/components/schemas/KycStatus'
          default: not_started
        requirePhoneNumber:
          type: boolean
          title: Requirephonenumber
          default: false
        requireAddress:
          type: boolean
          title: Requireaddress
          default: false
        requireKyb:
          type: boolean
          title: Requirekyb
          default: false
      type: object
      title: BankPreApproveResponse
      description: Read-only KYC info for a rail. Does not mutate Bank rows.
