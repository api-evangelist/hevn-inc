openapi: 3.1.0
info:
  title: HEVN 2FA Transactions API
  description: Backend API for HEVN mobile neobank
  version: 0.1.2
servers:
- url: https://api.hevn.finance
  description: Production
tags:
- name: Transactions
paths:
  /api/v1/transactions/export:
    get:
      tags:
      - Transactions
      summary: Export transactions
      description: Export transactions as CSV or XLSX file.
      operationId: export_transactions_api_v1_transactions_export_get
      security:
      - HTTPBearer: []
      parameters:
      - name: format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TransactionExportFormat'
          default: csv
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated transaction types
          title: Type
        description: Comma-separated transaction types
      - name: incomeOnly
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Incomeonly
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated tags
          title: Tag
        description: Comma-separated tags
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated unified statuses
          title: Status
        description: Comma-separated unified statuses
      - name: contactId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated contact UUIDs
          title: Contactid
        description: Comma-separated contact UUIDs
      - name: bank_account_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated bank account UUIDs
          title: Bank Account Id
        description: Comma-separated bank account UUIDs
      - name: bankAccountId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated bank account UUIDs
          title: Bankaccountid
        description: Comma-separated bank account UUIDs
      - name: cardId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated Card UUIDs
          title: Cardid
        description: Comma-separated Card UUIDs
      - name: fromDate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Fromdate
      - name: toDate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Todate
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text search across description, merchant, tag, hash/wallet, contact name, counterparty user, invoice contractor, IBAN, and exact amount. Min 2 chars; values shorter are ignored.
          title: Q
        description: Free-text search across description, merchant, tag, hash/wallet, contact name, counterparty user, invoice contractor, IBAN, and exact amount. Min 2 chars; values shorter are ignored.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/transactions:
