          - type: 'null'
          description: Comma-separated bank account UUIDs
          title: Bank Account Id
        description: Comma-separated bank account UUIDs
      - name: bankAccountId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated bank account UUIDs
          title: Bankaccountid
        description: Comma-separated bank account UUIDs
      - name: cardId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated Card UUIDs
          title: Cardid
        description: Comma-separated Card UUIDs
      - name: fromDate
