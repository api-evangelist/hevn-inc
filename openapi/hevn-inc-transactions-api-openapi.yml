      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: sortBy
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TransactionSortBy'
          default: date
      - name: sortOrder
        in: query
        required: false
