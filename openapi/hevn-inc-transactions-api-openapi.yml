openapi: 3.2.0
info:
  title: HEVN Platform Transactions API
  description: 'HEVN''s account, verification and money-movement API. Verification follows a submission workflow: save applicant info and documents, inspect outstanding requirements, then explicitly complete the submission to send an immutable snapshot for review. Completing a submission is separate from editing it.'
  version: 1.0.0
tags:
- name: Transactions
  description: Read and export the account ledger.
paths:
  /transactions/sync:
    post:
      tags:
      - Transactions
      summary: Refresh the client's ledger from its sources
      description: 'Refresh the client''s ledger from the banks and chains its money moved over, then answer how many entries changed. Reads never do this on their own: `GET /dapi/v1/transactions` answers from the ledger as it stands, so call this when a transfer made elsewhere has to be visible before you read. It reaches out to every source, so it is rate-limited and not a per-request call.'
      operationId: sync_transactions_transactions_sync_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerSyncView'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /transactions:
    get:
      tags:
      - Transactions
      summary: List transactions, newest first
      description: 'Cursor-paged: pass `nextCursor` back as `cursor`. There is no offset and no total.'
      operationId: list_transactions_transactions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated transaction types
          title: Type
        description: Comma-separated transaction types
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated statuses
          title: Status
        description: Comma-separated statuses
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated tags
          title: Tag
        description: Comma-separated tags
      - name: contactId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Contactid
      - name: bankId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankid
      - name: incomeOnly
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Incomeonly
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
          - type: 'null'
          title: Q
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Cursor
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_TransactionView_'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /transactions/summary:
    get:
      tags:
      - Transactions
      summary: Inflow and outflow totals for the same filters
      description: 'Its own route: an aggregate is never folded into a page.'
      operationId: read_summary_transactions_summary_get
      security:
      - HTTPBearer: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated transaction types
          title: Type
        description: Comma-separated transaction types
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated statuses
          title: Status
        description: Comma-separated statuses
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated tags
          title: Tag
        description: Comma-separated tags
      - name: contactId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Contactid
      - name: bankId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankid
      - name: incomeOnly
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Incomeonly
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
          - type: 'null'
          title: Q
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSummaryView'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /transactions/export:
    get:
      tags:
      - Transactions
      summary: Export transactions, a statement, a confirmation or a receipt
      description: Without `kind` the filtered transaction list is exported as `csv`, `xlsx` or `pdf`. `kind=statement` and `kind=confirmation` need `bankId` and support `pdf` or `xlsx`; `kind=receipt` needs `transactionId` and answers `pdf`.
      operationId: export_transactions_transactions_export_get
      security:
      - HTTPBearer: []
      parameters:
      - name: format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ExportFormat'
          default: csv
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ExportKind'
          - type: 'null'
          title: Kind
      - name: bankId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankid
      - name: transactionId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Transactionid
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated transaction types
          title: Type
        description: Comma-separated transaction types
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated statuses
          title: Status
        description: Comma-separated statuses
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated tags
          title: Tag
        description: Comma-separated tags
      - name: contactId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Contactid
      - name: incomeOnly
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Incomeonly
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
          - type: 'null'
          title: Q
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: The rendered file, with a `Content-Disposition` naming it.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /transactions/{transactionId}:
    get:
      tags:
      - Transactions
      summary: Retrieve one transaction
      description: Retrieve one ledger transaction with detailed counterparties, payment references and attachments visible to the selected account.
      operationId: read_transaction_transactions__transactionId__get
      security:
      - HTTPBearer: []
      parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          type: string
          description: Prefixed transaction id
          title: Transactionid
        description: Prefixed transaction id
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailView'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
components:
  schemas:
    ExportFormat:
      type: string
      enum:
      - csv
      - xlsx
      - pdf
      title: ExportFormat
    TransactionDetailView:
      properties:
        id:
          anyOf:
          - type: string
            pattern: ^(?:txn_)?[A-Za-z0-9._:\-]{1,216}$
            examples:
            - txn_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          - type: 'null'
          title: Id
          description: Stable public identifier for this transaction.
        type:
          type: string
          title: Type
          description: Public transaction type.
        status:
          $ref: '#/components/schemas/TransactionStatus'
          description: Current transaction lifecycle status.
        isIncome:
          type: boolean
          title: Isincome
          description: Whether this transaction increases the selected account's balance.
        from:
          anyOf:
          - $ref: '#/components/schemas/TransactionSideView'
          - type: 'null'
          description: Source side of the transaction.
        to:
          anyOf:
          - $ref: '#/components/schemas/TransactionSideView'
          - type: 'null'
          description: Destination side of the transaction.
        fee:
          anyOf:
          - $ref: '#/components/schemas/TransactionSideView'
          - type: 'null'
          description: Fee side of the transaction, when charged.
        counterparty:
          anyOf:
          - type: string
          - type: 'null'
          title: Counterparty
          description: Human-readable counterparty name.
        paymentReference:
          anyOf:
          - type: string
          - type: 'null'
          title: Paymentreference
          description: Reference or memo associated with the transfer.
        remitter:
          anyOf:
          - type: string
          - type: 'null'
          title: Remitter
          description: Originator information reported by the payment network.
        txHash:
          anyOf:
          - type: string
          - type: 'null'
          title: Txhash
          description: On-chain transaction hash associated with this ledger entry.
        tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
          description: Public transaction classification tag.
        hasAttachments:
          type: boolean
          title: Hasattachments
          description: Whether supporting documents are attached.
          default: false
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: UTC timestamp when the transaction was created.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Human-readable description supplied for this transaction.
        explorerUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Explorerurl
          description: Public blockchain-explorer URL for the transaction.
        traceNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Tracenumber
          description: Account-transfer or payment-network trace identifier.
        attachmentIds:
          items:
            type: string
          type: array
          title: Attachmentids
          description: Supporting document identifiers.
      type: object
      required:
      - type
      - status
      - isIncome
      - createdAt
      title: TransactionDetailView
    Page_TransactionView_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TransactionView'
          type: array
          title: Items
          description: Resources in this page, in stable server-defined order.
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
          description: Opaque cursor for the next page; absent when this is the final page.
      type: object
      required:
      - items
      title: Page[TransactionView]
    PlatformErrorCode:
