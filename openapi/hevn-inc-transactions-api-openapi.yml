      - payin_not_found
      - transaction_not_found
      - account_unavailable
      - account_not_supported
      - swap_not_found
      - swap_route_unavailable
      - swap_not_confirmable
      - intent_not_signable
      title: PlatformErrorCode
    ExportKind:
      type: string
      enum:
      - statement
      - confirmation
      - receipt
      title: ExportKind
    TransactionSummaryView:
      properties:
        inflowUsd:
          type: string
          title: Inflowusd
          description: Settled incoming value converted to USD for the selected period.
          example: '500.00'
        inflowCount:
          type: integer
          title: Inflowcount
          description: Number of settled incoming transactions in the selected period.
        outflowUsd:
          type: string
          title: Outflowusd
          description: Settled outgoing value converted to USD for the selected period.
          example: '500.00'
        outflowCount:
          type: integer
          title: Outflowcount
          description: Number of settled outgoing transactions in the selected period.
        pendingInflowUsd:
          type: string
          title: Pendinginflowusd
          description: Pending incoming value converted to USD.
          example: '500.00'
        pendingInflowCount:
          type: integer
          title: Pendinginflowcount
          description: Number of pending incoming transactions.
        pendingOutflowUsd:
          type: string
          title: Pendingoutflowusd
          description: Pending outgoing value converted to USD.
          example: '500.00'
        pendingOutflowCount:
          type: integer
          title: Pendingoutflowcount
          description: Number of pending outgoing transactions.
      type: object
      required:
      - inflowUsd
      - inflowCount
      - outflowUsd
      - outflowCount
      - pendingInflowUsd
      - pendingInflowCount
      - pendingOutflowUsd
      - pendingOutflowCount
      title: TransactionSummaryView
    TransactionView:
      properties:
        id:
          anyOf:
          - type: string
            pattern: ^(?:txn_)?[A-Za-z0-9._:\-]{1,216}$
            examples:
            - txn_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          - type: 'null'
          title: Id
          description: Stable public identifier for this transaction.
        type:
          type: string
          title: Type
          description: Public transaction type.
        status:
          $ref: '#/components/schemas/TransactionStatus'
          description: Current transaction lifecycle status.
        isIncome:
          type: boolean
          title: Isincome
          description: Whether this transaction increases the selected account's balance.
        from:
          anyOf:
          - $ref: '#/components/schemas/TransactionSideView'
          - type: 'null'
          description: Source side of the transaction.
        to:
          anyOf:
          - $ref: '#/components/schemas/TransactionSideView'
          - type: 'null'
          description: Destination side of the transaction.
        fee:
          anyOf:
          - $ref: '#/components/schemas/TransactionSideView'
          - type: 'null'
          description: Fee side of the transaction, when charged.
        counterparty:
          anyOf:
          - type: string
          - type: 'null'
          title: Counterparty
          description: Human-readable counterparty name.
        paymentReference:
          anyOf:
          - type: string
          - type: 'null'
          title: Paymentreference
          description: Reference or memo associated with the transfer.
        remitter:
          anyOf:
          - type: string
          - type: 'null'
          title: Remitter
          description: Originator information reported by the payment network.
        txHash:
          anyOf:
          - type: string
          - type: 'null'
          title: Txhash
          description: On-chain transaction hash associated with this ledger entry.
        tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
          description: Public transaction classification tag.
        hasAttachments:
          type: boolean
          title: Hasattachments
          description: Whether supporting documents are attached.
          default: false
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: UTC timestamp when the transaction was created.
      type: object
      required:
      - type
      - status
      - isIncome
      - createdAt
      title: TransactionView
    LedgerSyncView:
      properties:
        syncedAt:
          type: string
          format: date-time
          title: Syncedat
          description: When this refresh finished.
        written:
          type: integer
          title: Written
          description: Transactions the refresh created or updated in the client's ledger.
      type: object
      required:
      - syncedAt
      - written
      title: LedgerSyncView
    TransactionStatus:
      type: string
      enum:
      - pending
      - rfi
      - success
      - failed
      - refunded
      title: TransactionStatus
    TransactionSideView:
      properties:
        amount:
          type: string
          title: Amount
          description: Amount on this side of the transaction.
          example: '500.00'
        currency:
          type: string
          title: Currency
          description: ISO 4217 fiat code or supported digital-asset symbol.
        usdRate:
          anyOf:
          - type: string
            example: '500.00'
          - type: 'null'
          title: Usdrate
          description: Indicative conversion rate from this asset into USD.
      type: object
      required:
      - amount
      - currency
      title: TransactionSideView
    PlatformErrorResponse:
      properties:
