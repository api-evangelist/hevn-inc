        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/transactions/{transaction_id}/attachments:
    post:
      tags:
      - Transactions
      summary: Attach a document to a transaction
      description: Append an already-uploaded document (by id) to the transaction's attachments. The document must belong to the same user. Idempotent — re-attaching an existing id is a no-op. Returns the full updated list with signed download links.
      operationId: attach_document_to_transaction_api_v1_transactions__transaction_id__attachments_post
      security:
      - HTTPBearer: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          title: Transaction Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/app__schemas__routers__transactions__transaction__AttachDocumentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionAttachment'
                title: Response Attach Document To Transaction Api V1 Transactions  Transaction Id  Attachments Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    TransactionBreakdownItem:
      properties:
        key:
          type: string
          title: Key
        volumeUsd:
          type: number
          title: Volumeusd
        count:
          type: integer
          title: Count
      type: object
      required:
      - key
      - volumeUsd
      - count
      title: TransactionBreakdownItem
      description: One bucket in a breakdown — volume + count for a tag/type value.
    app__schemas__base__ContactRelationship:
      type: string
      enum:
      - charity
      - commercial_investment
      - corporate_card
      - credit_card
      - dividend
      - family
      - financial_services
      - good_sold
      - goods_bought
      - government
      - insurance
      - intergroup_transfer
      - intra_group_dividends
      - information_technology
      - leasing
      - loan_charges
      - merchant_settlement
      - mobile_wallet
      - none
      - non_resident_transfer_between_accounts
      - pension
      - personal_expenses
      - prepaid_cards
      - professional
      - rental
      - resident_transfer_between_accounts
      - salaries
      - telecommunications
      - travel
      - utility_bill
      title: ContactRelationship
      description: 'Unified contact relationship / transfer purpose.


        Values match Align AlignTransferPurpose (the more granular set).

        Mapped to Swipelux AccountHolderRelationship via ``swipelux_relationship``.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TransactionStatus:
      type: string
      enum:
      - pending
      - success
      - failed
      - refunded
      title: TransactionStatus
      description: Unified transaction status.
    TransactionAmountDetail:
      properties:
        currency:
          type: string
          title: Currency
        amount:
          type: number
          title: Amount
        usdRate:
          anyOf:
          - type: number
          - type: 'null'
          title: Usdrate
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      type: object
      required:
      - currency
      - amount
      title: TransactionAmountDetail
      description: Currency / amount / rate leg of a transaction.
    TransactionSortBy:
      type: string
      enum:
      - date
      - amount
      title: TransactionSortBy
      description: Field to sort the transaction list by.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TransactionSummary:
      properties:
        inflowUsd:
          type: number
          title: Inflowusd
        inflowCount:
          type: integer
          title: Inflowcount
        outflowUsd:
          type: number
          title: Outflowusd
        outflowCount:
          type: integer
          title: Outflowcount
        pendingInflowUsd:
          type: number
          title: Pendinginflowusd
        pendingInflowCount:
          type: integer
          title: Pendinginflowcount
        pendingOutflowUsd:
          type: number
          title: Pendingoutflowusd
        pendingOutflowCount:
          type: integer
          title: Pendingoutflowcount
      type: object
      required:
      - inflowUsd
      - inflowCount
      - outflowUsd
      - outflowCount
      - pendingInflowUsd
      - pendingInflowCount
      - pendingOutflowUsd
      - pendingOutflowCount
      title: TransactionSummary
      description: 'Aggregate volumes and counts over the filtered transaction set.


        Computed without LIMIT/OFFSET — represents the entire filtered scope,

        not just the current page. Returned only on the first page (offset=0);

