      tags:
      - Transactions
      summary: Set transaction tag
      description: Set or clear a tag on a transaction.
      operationId: set_transaction_tag_api_v1_transactions__transaction_id__tag_post
      security:
      - HTTPBearer: []
      parameters:
      - name: transaction_id
        in: path
        required: true
