openapi: 3.2.0
info:
  title: HEVN Platform Verification API
  description: 'HEVN''s account, verification and money-movement API. Verification follows a submission workflow: save applicant info and documents, inspect outstanding requirements, then explicitly complete the submission to send an immutable snapshot for review. Completing a submission is separate from editing it.'
  version: 1.0.0
tags:
- name: Verification
  description: Collect business-applicant and related-individual information, inspect requirements, and complete a verification submission for review.
paths:
  /client/kyb:
    put:
      tags:
      - Verification
      summary: Provide applicant information
      description: 'Save information for the business applicant and its related individual applicants in the entity graph. This updates an editable verification submission; it does not send anything for review. People are addressed by a stable `key` chosen by the caller, so retrying the same body updates the same entities. Omitting `people` leaves the roster unchanged; sending `people: []` removes only caller-managed people. `ready: false` is a successful draft write and `missing` names every outstanding field or document.'
      operationId: write_kyb_client_kyb_put
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
          examples:
          - po-inv-2026-114
          title: Idempotency-Key
        description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
      - name: X-Hevn-Account
        in: header
        required: true
        schema:
          type: string
          description: The selected client account, as a `cl_…` id.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The selected client account, as a `cl_…` id.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformKybWriteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformKybWriteResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
    get:
      tags:
      - Verification
      summary: Retrieve the verification submission
      description: Return the current editable applicant information, related people, filed documents, outstanding requirements and the latest review status. `missing` is authoritative for whether `complete` can succeed. A pending or completed review is read-only as an application snapshot; later draft edits apply to the next submission.
      operationId: read_kyb_client_kyb_get
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Hevn-Account
        in: header
        required: true
        schema:
          type: string
          description: The selected client account, as a `cl_…` id.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The selected client account, as a `cl_…` id.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformKybResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /client/kyb/complete:
    post:
      tags:
      - Verification
      summary: Complete the verification submission
      description: Close the editable submission and send its immutable snapshot for compliance review. This is the only operation that starts review. It is refused with `kyb_incomplete` and the same `missing` paths returned by GET when applicant information or documents are outstanding. An identical retry replays the existing application instead of creating a second review.
      operationId: complete_kyb_client_kyb_complete_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Hevn-Account
        in: header
        required: true
        schema:
          type: string
          description: The selected client account, as a `cl_…` id.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The selected client account, as a `cl_…` id.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
          examples:
          - po-inv-2026-114
          title: Idempotency-Key
        description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformKybSubmitResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
components:
  schemas:
    HighRiskActivity:
      type: string
      enum:
      - MONEY_SERVICES
      - LENDING_BANKING
      - OTC_FX_CRYPTO_BROKERAGE
      - HOLD_CLIENT_FUNDS
      - INVESTMENT_SERVICES
      - SAFE_DEPOSIT_BOX
      - PRECIOUS_METALS_STONES_JEWELRY
      - NICOTINE_TOBACCO
      - MARIJUANA
      - PHARMACEUTICALS
      - THIRD_PARTY_PAYMENT_PROCESSING
      - ADULT_ENTERTAINMENT
      - WEAPONS_FIREARMS_EXPLOSIVES
      - GAMBLING
      title: HighRiskActivity
    PlatformKybPersonView:
      properties:
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
          description: Caller-chosen stable key for this related applicant.
        id:
          type: string
          format: uuid
          title: Id
          description: Entity identifier assigned to the related applicant.
        firstName:
          anyOf:
          - type: string
          - type: 'null'
          title: Firstname
          description: Applicant's legal given name.
        middleName:
          anyOf:
          - type: string
          - type: 'null'
          title: Middlename
          description: Applicant's legal middle name, if any.
        lastName:
          anyOf:
          - type: string
          - type: 'null'
          title: Lastname
          description: Applicant's legal family name.
        dateOfBirth:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateofbirth
          description: Applicant's date of birth.
        birthCountry:
          anyOf:
          - type: string
          - type: 'null'
          title: Birthcountry
          description: ISO country code of birth.
        nationalities:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Nationalities
          description: Applicant nationalities as ISO country codes.
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Office held in the business.
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
          description: ISO country code of residence.
        linkedinUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Linkedinurl
          description: Public LinkedIn profile URL.
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: Applicant email used for verification correspondence.
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
          description: Applicant phone number in E.164 format.
        address:
          anyOf:
          - $ref: '#/components/schemas/PlatformKybAddressView'
          - type: 'null'
          description: Applicant residential address.
        taxIdCountry:
          anyOf:
          - type: string
          - type: 'null'
          title: Taxidcountry
          description: ISO country code of tax residence.
        taxId:
          anyOf:
          - type: string
          - type: 'null'
          title: Taxid
          description: Personal tax identifier exactly as issued.
        identityDocuments:
          items:
            $ref: '#/components/schemas/PlatformKybIdentityDocumentView'
          type: array
          title: Identitydocuments
          description: Identity-document metadata for this applicant.
        ownershipPercentage:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Ownershippercentage
          description: Direct ownership percentage.
        hasControl:
          type: boolean
          title: Hascontrol
          description: Whether this applicant exercises control.
          default: false
        isDirector:
          type: boolean
          title: Isdirector
          description: Whether this applicant is a director.
          default: false
        isSigner:
          type: boolean
          title: Issigner
          description: Whether this applicant is authorized to sign.
          default: false
        documents:
          items:
            $ref: '#/components/schemas/PlatformKybDocumentView'
          type: array
          title: Documents
          description: Files attached to this related applicant.
      type: object
      required:
      - id
      title: PlatformKybPersonView
    PlatformKybPerson:
      properties:
        key:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9._:\-]{1,64}$
          - type: 'null'
          title: Key
          description: Stable caller-chosen key used to address the same child applicant on later writes.
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: Entity id returned by an earlier write; use either id or key.
        firstName:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Firstname
          description: Applicant's legal given name.
        middleName:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Middlename
          description: Applicant's legal middle name, if any.
        lastName:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Lastname
          description: Applicant's legal family name.
        dateOfBirth:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateofbirth
          description: Applicant's date of birth.
        birthCountry:
          anyOf:
          - $ref: '#/components/schemas/CountryCode'
          - type: 'null'
          description: ISO 3166-1 alpha-2 country of birth.
        nationalities:
          anyOf:
          - items:
              $ref: '#/components/schemas/CountryCode'
            type: array
          - type: 'null'
          title: Nationalities
          description: Applicant nationalities as ISO 3166-1 alpha-2 country codes.
        title:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Title
          description: Office held in the company, for example Director.
        country:
          anyOf:
          - $ref: '#/components/schemas/CountryCode'
          - type: 'null'
          description: ISO 3166-1 alpha-2 country of residence.
        linkedinUrl:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 1
          - type: 'null'
          title: Linkedinurl
          description: Public LinkedIn profile URL used to corroborate applicant information.
        email:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Email
          description: Applicant email used for verification correspondence.
        phone:
          anyOf:
          - type: string
            pattern: ^\+[1-9]\d{6,14}$
          - type: 'null'
          title: Phone
          description: Applicant phone number in E.164 format.
        address:
          anyOf:
          - $ref: '#/components/schemas/PlatformKybAddress'
          - type: 'null'
          description: Applicant residential address.
        taxIdCountry:
          anyOf:
          - $ref: '#/components/schemas/CountryCode'
          - type: 'null'
          description: ISO 3166-1 alpha-2 tax-residence country; it is not inferred from nationality or address.
        taxId:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Taxid
          description: Personal tax identifier exactly as issued.
        identityDocuments:
          anyOf:
          - items:
              $ref: '#/components/schemas/PlatformKybIdentityDocument'
            type: array
          - type: 'null'
          title: Identitydocuments
          description: Identity-document metadata. Files are attached through documents.
        ownershipPercentage:
          anyOf:
          - type: number
            maximum: 100.0
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Ownershippercentage
          description: Direct ownership percentage in the parent business.
        hasControl:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Hascontrol
          description: Whether this applicant exercises control.
        isDirector:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Isdirector
          description: Whether this applicant is a director.
        isSigner:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Issigner
          description: Whether this applicant is authorized to sign.
        documents:
          anyOf:
          - items:
              $ref: '#/components/schemas/PlatformKybDocument'
            type: array
          - type: 'null'
          title: Documents
          description: Files attached to this child applicant, referenced by uploadId.
      additionalProperties: false
      type: object
      title: PlatformKybPerson
