openapi: 3.2.0
info:
  title: HEVN Platform Transfers API
  description: 'HEVN''s account, verification and money-movement API. Verification follows a submission workflow: save applicant info and documents, inspect outstanding requirements, then explicitly complete the submission to send an immutable snapshot for review. Completing a submission is separate from editing it.'
  version: 1.0.0
tags:
- name: Transfers
  description: Quote, create, authorize and track incoming or outgoing transfers.
paths:
  /payouts:
    post:
      tags:
      - Transfers
      summary: Create an outgoing transfer
      description: Validate the contact, fix the transfer terms, reserve an idempotent outgoing transfer and return the approval payload to sign. Supplying `amount` fixes the debit side; `amountTo` fixes the contact side.
      operationId: create_payout_payouts_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
          examples:
          - po-inv-2026-114
          title: Idempotency-Key
        description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /payouts/preview:
    post:
      tags:
      - Transfers
      summary: Create an outgoing transfer quote
      description: Estimate rate, fees, limits and contact amount without creating a contact, transfer or external side effect.
      operationId: preview_payout_payouts_preview_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutPreviewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutPreviewResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /payouts/{payoutId}/confirm:
    post:
      tags:
      - Transfers
      summary: Authorize an outgoing transfer
      description: Verify the developer-key signature against the immutable approval and fund the prepared transfer. A retry cannot change the contact, amount, payment method or quote.
      operationId: confirm_payout_payouts__payoutId__confirm_post
      security:
      - HTTPBearer: []
      parameters:
      - name: payoutId
        in: path
        required: true
        schema:
          type: string
          title: Payoutid
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutReceiptResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutReceiptResponse'
          description: Accepted
  /payouts/{payoutId}:
    get:
      tags:
      - Transfers
      summary: Retrieve an outgoing transfer
      description: Retrieve the current transfer lifecycle, including quote, contact, settlement result and any actionable failure.
      operationId: read_payout_payouts__payoutId__get
      security:
      - HTTPBearer: []
      parameters:
      - name: payoutId
        in: path
        required: true
        schema:
          type: string
          title: Payoutid
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutReadResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /swaps:
    post:
      tags:
      - Transfers
      summary: Create a transfer between the client's own accounts
      description: 'Price a move between two accounts the client owns, reserve it idempotently and return the approval to sign. `authorization` says what that approval covers: a `debit` of the client''s wallet that funds the move, or an `intent` its smart wallet signs so the backend can settle it.'
      operationId: create_swap_swaps_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
          examples:
          - po-inv-2026-114
          title: Idempotency-Key
        description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /swaps/preview:
    post:
      tags:
      - Transfers
      summary: Price a transfer between the client's own accounts
      description: Compare every route that can serve this pair of accounts and return the best price. Nothing is booked with a provider and nothing is signed.
      operationId: preview_swap_swaps_preview_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapPreviewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapPreviewResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /swaps/{swapId}/confirm:
    post:
      tags:
      - Transfers
      summary: Authorize a transfer between the client's own accounts
      description: Verify the developer-key signature against the immutable approval and settle the move. A retry cannot change the accounts, the amount or the quote it was fixed at.
      operationId: confirm_swap_swaps__swapId__confirm_post
      security:
      - HTTPBearer: []
      parameters:
      - name: swapId
        in: path
        required: true
        schema:
          type: string
          title: Swapid
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapReceiptResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapReceiptResponse'
          description: Accepted
  /swaps/{swapId}:
    get:
      tags:
      - Transfers
      summary: Retrieve a transfer between the client's own accounts
      description: Retrieve the current lifecycle of a swap, the quote it was fixed at and any actionable failure.
      operationId: read_swap_swaps__swapId__get
      security:
      - HTTPBearer: []
      parameters:
      - name: swapId
        in: path
        required: true
        schema:
          type: string
          title: Swapid
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapReadResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /payins:
    post:
      tags:
      - Transfers
      summary: Create an incoming transfer quote
      description: Price money arriving for this account. Set `originChainId` for an on-chain transfer or `rail` for a local payment method; exactly one is required. An unsupported route answers `payin_not_available`.
      operationId: create_payin_payins_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
          examples:
          - po-inv-2026-114
          title: Idempotency-Key
        description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayinCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinView'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /payins/{payinId}/instructions:
    post:
      tags:
      - Transfers
      summary: Open the incoming transfer and retrieve funding instructions
      description: 'Idempotent: an already-open transfer returns the same payment-account details or on-chain deposit address. A quote that stopped holding answers `410 payin_expired`.'
      operationId: open_payin_payins__payinId__instructions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: payinId
        in: path
        required: true
        schema:
          type: string
          description: Prefixed pay-in id
          title: Payinid
        description: Prefixed pay-in id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
          examples:
          - po-inv-2026-114
          title: Idempotency-Key
        description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayinInstructionsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinInstructionsView'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /payins/{payinId}:
    get:
      tags:
      - Transfers
      summary: Retrieve an incoming transfer
      description: Retrieve an incoming-transfer quote and its current funding lifecycle. Use the instructions operation when payment details are still required.
      operationId: read_payin_payins__payinId__get
      security:
      - HTTPBearer: []
      parameters:
      - name: payinId
        in: path
        required: true
        schema:
          type: string
          description: Prefixed pay-in id
          title: Payinid
        description: Prefixed pay-in id
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayinView'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
components:
  schemas:
    PayinCreateRequest:
      properties:
        amount:
          anyOf:
          - anyOf:
            - type: number
            - type: string
              pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
            example: '500.00'
          - type: 'null'
          title: Amount
          description: Exact amount funded in the source currency.
        amountTo:
          anyOf:
          - anyOf:
            - type: number
            - type: string
              pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
            example: '500.00'
          - type: 'null'
          title: Amountto
          description: Exact amount to settle to the account.
        currency:
          type: string
          title: Currency
          description: ISO 4217 fiat code or supported digital-asset symbol for amount.
        rail:
          anyOf:
          - $ref: '#/components/schemas/FiatPaymentType'
          - type: 'null'
          description: Local payment method; provide exactly one of rail or originChainId.
        originChainId:
          anyOf:
          - $ref: '#/components/schemas/ChainCode'
          - type: 'null'
          description: Network from which an on-chain incoming transfer is funded.
        destinationAccount:
          $ref: '#/components/schemas/AccountKey'
          description: Account credited after settlement. Incoming transfers settle to a token account.
          default: USDC
      additionalProperties: false
      type: object
      required:
      - currency
      title: PayinCreateRequest
    RequisitePixKeyType:
      type: string
      enum:
      - phone
      - email
      - tax_id
      - random
      title: RequisitePixKeyType
    ContactPaymentAccount:
      properties:
        method:
          $ref: '#/components/schemas/FiatPaymentType'
          description: Local payment method used to reach this contact.
        currency:
          type: string
          title: Currency
          description: ISO 4217 currency code accepted by the contact account.
        fields:
          $ref: '#/components/schemas/RequisiteFields'
          description: Structured destination account details.
        holder:
          $ref: '#/components/schemas/RequisiteHolder-Input'
          description: Identity and address of the destination account holder.
        bankName:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankname
          description: Name of the destination financial institution; required for ACH and Fedwire contacts.
        bankAddress:
          anyOf:
          - $ref: '#/components/schemas/BankAddress'
          - type: 'null'
          description: Postal address of the destination institution.
        intermediaryBank:
          anyOf:
          - $ref: '#/components/schemas/IntermediaryBank'
          - type: 'null'
          description: Optional intermediary institution used to route an international transfer.
        paymentReference:
          anyOf:
          - type: string
          - type: 'null'
          title: Paymentreference
          description: Reference or memo required by the contact.
      additionalProperties: false
      type: object
      required:
      - method
      - currency
      - holder
      title: ContactPaymentAccount
      description: Legacy flat payment-account input without internal routing metadata.
    SwapReadResponse:
      properties:
        id:
          type: string
          pattern: ^(?:swp_)?[A-Za-z0-9._:\-]{1,216}$
          title: Id
          description: Stable public identifier for this swap.
          examples:
          - swp_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
        status:
          $ref: '#/components/schemas/SwapState'
          description: Current public lifecycle status of the swap.
        sourceAccount:
          anyOf:
          - $ref: '#/components/schemas/AccountKey'
          - type: 'null'
          description: Account the money leaves.
        destinationAccount:
          anyOf:
          - $ref: '#/components/schemas/AccountKey'
          - type: 'null'
          description: Account the money lands on.
        quote:
          anyOf:
          - $ref: '#/components/schemas/SwapQuoteView'
          - type: 'null'
          description: Terms fixed when the swap was created.
        transactionHash:
          anyOf:
          - type: string
          - type: 'null'
          title: Transactionhash
          description: On-chain transaction hash, when broadcast.
        transactionId:
          anyOf:
          - type: string
            pattern: ^(?:txn_)?[A-Za-z0-9._:\-]{1,216}$
            examples:
            - txn_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          - type: 'null'
          title: Transactionid
          description: Ledger transaction identifier, when projected.
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: UTC timestamp when the swap was created.
        settledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Settledat
          description: UTC timestamp when settlement completed.
        failure:
          anyOf:
          - $ref: '#/components/schemas/SwapFailureView'
          - type: 'null'
          description: Terminal or actionable failure details.
      type: object
      required:
      - id
      - status
      - createdAt
      title: SwapReadResponse
    CountryCode:
      type: string
      enum:
      - AF
      - AX
      - AL
      - DZ
      - AS
      - AD
      - AO
      - AI
      - AQ
      - AG
      - AR
      - AM
      - AW
      - AU
      - AT
      - AZ
      - BS
      - BH
      - BD
      - BB
      - BY
      - BE
      - BZ
      - BJ
      - BM
      - BT
      - BO
      - BQ
      - BA
      - BW
      - BV
      - BR
      - IO
      - BN
      - BG
      - BF
      - BI
      - CV
