    UserAddress:
      properties:
        streetAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Streetaddress
          description: Street name and building number.
        addressLine2:
          anyOf:
          - type: string
          - type: 'null'
          title: Addressline2
          description: Optional apartment, suite or unit.
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
          description: City or locality.
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
          description: State, province or administrative area.
        country:
          anyOf:
          - $ref: '#/components/schemas/CountryCode'
          - type: 'null'
          description: ISO 3166-1 alpha-2 country code.
        zip:
          anyOf:
          - type: string
          - type: 'null'
          title: Zip
          description: Postal or ZIP code.
      type: object
      title: UserAddress
      description: Provider-neutral postal address used across domain and API schemas.
    ContactBlockerView:
      properties:
        code:
          $ref: '#/components/schemas/ContactBlockerCode'
          description: Stable machine-readable blocker code.
        message:
          type: string
          title: Message
          description: Human-readable explanation safe to show to an end user.
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
          description: Contact field associated with this blocker.
      type: object
      required:
      - code
      - message
      title: ContactBlockerView
    BankAddressInput:
