openapi: 3.2.0
info:
  title: HEVN Platform Contacts API
  description: 'HEVN''s account, verification and money-movement API. Verification follows a submission workflow: save applicant info and documents, inspect outstanding requirements, then explicitly complete the submission to send an immutable snapshot for review. Completing a submission is separate from editing it.'
  version: 1.0.0
tags:
- name: Contacts
  description: Create saved contacts and inspect their available payment channels.
paths:
  /contacts:
    post:
      tags:
      - Contacts
      summary: Create a contact
      description: Create an idempotent reusable contact from either payment-account or on-chain details. Fields are validated for the selected account type before persistence.
      operationId: create_contact_contacts_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
          examples:
          - po-inv-2026-114
          title: Idempotency-Key
        description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
    get:
      tags:
      - Contacts
      summary: List saved contacts
      description: List saved contacts using opaque cursor pagination.
      operationId: list_contacts_contacts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Cursor
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ContactResponse_'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /contacts/{contactId}:
    get:
      tags:
      - Contacts
      summary: Retrieve one contact
      description: Retrieve one saved contact without exposing internal routing or infrastructure identifiers.
      operationId: read_contact_contacts__contactId__get
      security:
      - HTTPBearer: []
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          title: Contactid
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
    patch:
      tags:
      - Contacts
      summary: Update a contact
      description: Update fields present in the request. Omitted fields are retained; immutable payment-routing identity cannot be replaced through this operation.
      operationId: update_contact_contacts__contactId__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          title: Contactid
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
          examples:
          - po-inv-2026-114
          title: Idempotency-Key
        description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
    delete:
      tags:
      - Contacts
      summary: Delete a contact
      description: Remove a saved contact from future selection. Existing transactions remain immutable and readable.
      operationId: delete_contact_contacts__contactId__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          title: Contactid
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
          examples:
          - po-inv-2026-114
          title: Idempotency-Key
        description: Your own key for this write, `^[A-Za-z0-9._:-]{1,128}$`. A retry with the same key replays the first answer; the same key with a different request is refused.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
  /contacts/{contactId}/capabilities:
    get:
      tags:
      - Contacts
      summary: Retrieve contact channels
      description: Return currently available payment methods, limits, fees and blockers. Capabilities are a point-in-time eligibility read, not a transfer quote.
      operationId: read_contact_capabilities_contacts__contactId__capabilities_get
      security:
      - HTTPBearer: []
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          title: Contactid
      - name: amount
        in: query
        required: false
        schema:
          anyOf:
          - anyOf:
            - type: number
            - type: string
              pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
            example: '500.00'
          - type: 'null'
          title: Amount
      - name: X-Hevn-Account
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
          examples:
          - cl_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          title: X-Hevn-Account
        description: The client account to act for, as a `cl_…` id. Omit it to act as yourself.
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactCapabilitiesResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformErrorResponse'
components:
  schemas:
    RequisitePixKeyType:
      type: string
      enum:
      - phone
      - email
      - tax_id
      - random
      title: RequisitePixKeyType
    PlatformEmailAccountInput:
      properties:
        accountType:
          type: string
          const: email
          title: Accounttype
          description: Selects an existing contact by email.
          default: email
        email:
          type: string
          title: Email
          description: Email used to resolve the existing contact account.
      additionalProperties: false
      type: object
      required:
      - email
      title: PlatformEmailAccountInput
    ContactPaymentAccount:
      properties:
        method:
          $ref: '#/components/schemas/FiatPaymentType'
          description: Local payment method used to reach this contact.
        currency:
          type: string
          title: Currency
          description: ISO 4217 currency code accepted by the contact account.
        fields:
          $ref: '#/components/schemas/RequisiteFields'
          description: Structured destination account details.
        holder:
          $ref: '#/components/schemas/RequisiteHolder-Input'
          description: Identity and address of the destination account holder.
        bankName:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankname
          description: Name of the destination financial institution; required for ACH and Fedwire contacts.
        bankAddress:
          anyOf:
          - $ref: '#/components/schemas/BankAddress'
          - type: 'null'
          description: Postal address of the destination institution.
        intermediaryBank:
          anyOf:
          - $ref: '#/components/schemas/IntermediaryBank'
          - type: 'null'
          description: Optional intermediary institution used to route an international transfer.
        paymentReference:
          anyOf:
          - type: string
          - type: 'null'
          title: Paymentreference
          description: Reference or memo required by the contact.
      additionalProperties: false
      type: object
      required:
      - method
      - currency
      - holder
      title: ContactPaymentAccount
      description: Legacy flat payment-account input without internal routing metadata.
    PlatformOnchainAccountInput:
      properties:
        accountType:
          type: string
          const: onchain
          title: Accounttype
          description: Selects the on-chain contact schema.
          default: onchain
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: Optional email associated with the destination wallet.
        walletAddress:
          type: string
          title: Walletaddress
          description: On-chain destination address.
        chainId:
          $ref: '#/components/schemas/ChainCode'
          description: Blockchain network on which the destination exists.
        currency:
          type: string
          title: Currency
          description: Digital asset the contact accepts.
      additionalProperties: false
      type: object
      required:
      - walletAddress
      - chainId
      - currency
      title: PlatformOnchainAccountInput
