openapi: 3.1.0
info:
  title: HEVN 2FA Utils API
  description: Backend API for HEVN mobile neobank
  version: 0.1.2
servers:
- url: https://api.hevn.finance
  description: Production
tags:
- name: Utils
paths:
  /api/v1/utils/parse-iban:
    post:
      tags:
      - Utils
      summary: Parse IBAN from plain text
      description: Extract SEPA IBAN data from plain text using AI. Returns structured ImportIbanSepaData.
      operationId: parse_iban_text_api_v1_utils_parse_iban_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseIbanTextRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportIbanSepaData'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/utils/rates/{currency}:
    get:
      tags:
      - Utils
      summary: Get FX rates
      description: 'Public endpoint. Returns FX rates from the given currency to USD: `bankTransfer` (Swipelux), `card` (Wirex), and `usdRate` (exchangerate-api.com). `usdRate` is populated for every currency in the invoice Currency enum (G10 + AED/HKD).'
      operationId: get_rate_api_v1_utils_rates__currency__get
      parameters:
      - name: currency
        in: path
        required: true
        schema:
          type: string
          title: Currency
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/utils/bic/{bic}:
    get:
      tags:
      - Utils
      summary: Get BIC (SWIFT) info
      description: Look up bank/branch info by BIC code via API Ninjas.
      operationId: get_bic_info_api_v1_utils_bic__bic__get
      parameters:
      - name: bic
        in: path
        required: true
        schema:
          type: string
          title: Bic
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BicInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/utils/rtn/{routing_number}:
    get:
      tags:
      - Utils
      summary: Validate US routing number (RTN)
      description: Look up US ABA/RTN routing number via API Ninjas.
      operationId: get_rtn_info_api_v1_utils_rtn__routing_number__get
      parameters:
      - name: routing_number
        in: path
        required: true
        schema:
          type: string
          title: Routing Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RtnLiteInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/utils/iban/{iban}:
    get:
      tags:
      - Utils
      summary: Validate IBAN
      description: Validate IBAN and return bank/account info via API Ninjas.
      operationId: validate_iban_api_v1_utils_iban__iban__get
      parameters:
      - name: iban
        in: path
        required: true
        schema:
          type: string
          title: Iban
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IbanInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/accounts/utils/parse-iban:
    post:
      tags:
      - Utils
      summary: Parse IBAN from plain text
      description: Extract SEPA IBAN data from plain text using AI. Returns structured ImportIbanSepaData.
      operationId: parse_iban_text_package_alias_api_v1_accounts_utils_parse_iban_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseIbanTextRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportIbanSepaData'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/accounts/utils/rates/{currency}:
    get:
      tags:
      - Utils
      summary: Get FX rates
      description: 'Public endpoint. Returns FX rates from the given currency to USD: `bankTransfer` (Swipelux), `card` (Wirex), and `usdRate` (exchangerate-api.com). `usdRate` is populated for every currency in the invoice Currency enum (G10 + AED/HKD).'
      operationId: get_rate_package_alias_api_v1_accounts_utils_rates__currency__get
      parameters:
      - name: currency
        in: path
        required: true
        schema:
          type: string
          title: Currency
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/accounts/utils/bic/{bic}:
    get:
      tags:
      - Utils
      summary: Get BIC (SWIFT) info
      description: Look up bank/branch info by BIC code via API Ninjas.
      operationId: get_bic_info_package_alias_api_v1_accounts_utils_bic__bic__get
      parameters:
      - name: bic
        in: path
        required: true
        schema:
          type: string
          title: Bic
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BicInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/accounts/utils/rtn/{routing_number}:
    get:
      tags:
      - Utils
      summary: Validate US routing number (RTN)
      description: Look up US ABA/RTN routing number via API Ninjas.
      operationId: get_rtn_info_package_alias_api_v1_accounts_utils_rtn__routing_number__get
      parameters:
      - name: routing_number
        in: path
        required: true
        schema:
          type: string
          title: Routing Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RtnLiteInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/accounts/utils/iban/{iban}:
    get:
      tags:
      - Utils
      summary: Validate IBAN
      description: Validate IBAN and return bank/account info via API Ninjas.
      operationId: validate_iban_package_alias_api_v1_accounts_utils_iban__iban__get
      parameters:
      - name: iban
        in: path
        required: true
        schema:
          type: string
          title: Iban
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IbanInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    FincodesCity:
      properties:
        id:
          type: string
          title: Id
        country_id:
          type: string
          title: Country Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - country_id
      - name
      title: FincodesCity
    UserAddress:
      properties:
        streetAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Streetaddress
        addressLine2:
          anyOf:
          - type: string
          - type: 'null'
          title: Addressline2
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        country:
          anyOf:
          - $ref: '#/components/schemas/CountryCode'
          - type: 'null'
        zip:
          anyOf:
          - type: string
          - type: 'null'
          title: Zip
      type: object
      title: UserAddress
      description: 'Address schema for user.


        Canonical field names: street_address, address_line_2, city, state, country, zip.

        Accepts legacy Align/IBAN field names (street_line_1, street_line_2, postal_code)

        for backward compatibility with existing JSONB data.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RtnLiteInfoResponse:
      properties:
        id:
          type: string
          title: Id
        bank:
          anyOf:
          - $ref: '#/components/schemas/FincodesBank'
          - type: 'null'
        parsed_address:
          anyOf:
          - $ref: '#/components/schemas/UserAddress'
          - type: 'null'
      type: object
      required:
      - id
      title: RtnLiteInfoResponse
      description: Simplified RTN response with only bank and address.
