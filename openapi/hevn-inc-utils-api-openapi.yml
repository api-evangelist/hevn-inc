        country_id:
          type: string
          title: Country Id
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - country_id
      - code
      - name
      title: FincodesBank
    SlxAccountHolderRelationship:
      type: string
      enum:
      - self
      - employee
      - independent_contractor
      - vendor
      - supplier
      - subsidiary
      - affiliate
      - merchant
      - partner
      - customer
      - landlord
      - family
      - other
      title: SlxAccountHolderRelationship
      description: Relationship of the account holder to the customer.
    ImportIbanSepaData:
      properties:
        iban:
          type: string
          maxLength: 34
          minLength: 15
          title: Iban
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
        accountHolderName:
          type: string
          maxLength: 255
          minLength: 1
          title: Accountholdername
        bankAddress:
          anyOf:
          - type: string
            maxLength: 512
            minLength: 1
          - type: 'null'
          title: Bankaddress
        bankName:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Bankname
        bic:
          anyOf:
          - type: string
            maxLength: 11
            minLength: 8
          - type: 'null'
          title: Bic
        label:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Label
        relationship:
          $ref: '#/components/schemas/SlxAccountHolderRelationship'
          default: self
      type: object
      required:
      - iban
      - country
      - currency
      - accountHolderName
      title: ImportIbanSepaData
      description: SEPA account data parsed from free-form text.
    ParseIbanTextRequest:
      properties:
        text:
          type: string
          maxLength: 5000
          minLength: 10
          title: Text
      type: object
      required:
      - text
      title: ParseIbanTextRequest
      description: Request to parse plain text and extract IBAN data.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    FincodesCountry:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: FincodesCountry
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      x-default: Bearer <token>
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Alternative HEVN API key header. The CLI defaults to Authorization Bearer unless configured with HEVN_API_KEY_HEADER=X-Api-Key.
