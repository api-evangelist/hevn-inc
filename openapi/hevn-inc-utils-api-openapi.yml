    IbanInfoResponse:
      properties:
        id:
          type: string
          title: Id
        account_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Number
        national_bank_code:
          anyOf:
          - type: string
          - type: 'null'
          title: National Bank Code
        national_branch_code:
          anyOf:
          - type: string
          - type: 'null'
          title: National Branch Code
        bic:
          anyOf:
          - $ref: '#/components/schemas/BicInfoResponse'
          - type: 'null'
        country:
          anyOf:
          - $ref: '#/components/schemas/FincodesCountry'
          - type: 'null'
      type: object
      required:
      - id
      title: IbanInfoResponse
      description: IBAN validation response from Fincodes API.
    BicInfoResponse:
      properties:
        id:
          type: string
          title: Id
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        postcode:
          anyOf:
          - type: string
          - type: 'null'
          title: Postcode
        branch_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch Name
        branch_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch Code
        country:
          anyOf:
          - $ref: '#/components/schemas/FincodesCountry'
          - type: 'null'
        city:
          anyOf:
          - $ref: '#/components/schemas/FincodesCity'
          - type: 'null'
        bank:
          anyOf:
          - $ref: '#/components/schemas/FincodesBank'
          - type: 'null'
        parsed_address:
          anyOf:
          - $ref: '#/components/schemas/UserAddress'
          - type: 'null'
          description: Parse address fields into UserAddress format.
          readOnly: true
      type: object
      required:
      - id
      - parsed_address
      title: BicInfoResponse
      description: BIC lookup response from Fincodes API.
    RateResponse:
      properties:
        bankTransfer:
          anyOf:
          - type: string
          - type: 'null'
          title: Banktransfer
        card:
          anyOf:
          - type: string
          - type: 'null'
          title: Card
        usdRate:
          anyOf:
          - type: string
          - type: 'null'
          title: Usdrate
      type: object
      title: RateResponse
      description: Combined FX rate response.
    FincodesBank:
