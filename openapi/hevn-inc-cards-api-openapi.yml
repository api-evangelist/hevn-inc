openapi: 3.1.0
info:
  title: HEVN 2FA Cards API
  description: Backend API for HEVN mobile neobank
  version: 0.1.2
servers:
- url: https://api.hevn.finance
  description: Production
tags:
- name: Cards
paths:
  /api/v1/cards/pre-approve:
    post:
      tags:
      - Cards
      summary: Pre-approve card issuance
      description: Check Wirex KYC prerequisites and return a verification URL if all required user fields are present.
      operationId: pre_approve_cards_api_v1_cards_pre_approve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardsPreApproveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cards/register:
    post:
      tags:
      - Cards
      summary: Register user for card services
      description: Register user with card provider. Required before issuing cards.
      operationId: register_for_cards_api_v1_cards_register_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardUserRegisterRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Register For Cards Api V1 Cards Register Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cards/phone:
    put:
      tags:
      - Cards
      summary: Set phone number
      description: Set user's phone number for verification.
      operationId: set_phone_number_api_v1_cards_phone_put
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
