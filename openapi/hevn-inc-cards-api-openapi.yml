    post:
      tags:
      - Cards
      summary: Send phone OTP
      description: Send SMS OTP to verify phone number.
      operationId: send_phone_otp_api_v1_cards_phone_otp_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
