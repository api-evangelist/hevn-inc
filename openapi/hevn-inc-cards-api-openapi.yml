    CardsPreApproveResponse:
      properties:
        kycUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Kycurl
        kycStatus:
          $ref: '#/components/schemas/KycStatus'
          default: not_started
        requirePhoneNumber:
          type: boolean
          title: Requirephonenumber
          default: false
        requireAddress:
          type: boolean
          title: Requireaddress
          default: false
      type: object
      title: CardsPreApproveResponse
      description: Pre-flight info for issuing Wirex cards.
    CardRevealRequest:
      properties:
        messageSignature:
          type: string
          title: Messagesignature
          description: Wallet signature of confirmation message
        nonce:
          type: integer
          title: Nonce
          description: Unix timestamp used in the signed message (valid 5 min)
      type: object
      required:
      - messageSignature
      - nonce
      title: CardRevealRequest
      description: Request to reveal card details. Requires wallet signature.
    CardLimit:
      properties:
        dailyLimit:
          anyOf:
          - type: number
          - type: 'null'
          title: Dailylimit
          description: Daily spending limit (-1 for unlimited)
        dailyUsage:
          type: number
          title: Dailyusage
          description: Amount spent today
          default: 0
        monthlyLimit:
          anyOf:
          - type: number
          - type: 'null'
          title: Monthlylimit
          description: Monthly spending limit (-1 for unlimited)
        monthlyUsage:
          type: number
          title: Monthlyusage
          description: Amount spent this month
          default: 0
        lifetimeLimit:
          anyOf:
          - type: number
          - type: 'null'
          title: Lifetimelimit
          description: Lifetime spending limit (-1 for unlimited)
        lifetimeUsage:
          type: number
          title: Lifetimeusage
          description: Total amount spent
          default: 0
        currency:
          type: string
          title: Currency
          default: EUR
      type: object
      title: CardLimit
      description: Card spending limit.
    KycStatus:
      type: string
      enum:
      - not_started
      - requested
      - incorporating
      - pending
      - under_review
      - in_review
      - approved
      - rejected
      title: KycStatus
      description: KYC verification status.
    CardFormat:
      type: string
      enum:
      - virtual
      - physical
      title: CardFormat
      description: Card format.
    KycLinkResponse:
