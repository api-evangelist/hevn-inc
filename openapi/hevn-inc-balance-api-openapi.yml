openapi: 3.1.0
info:
  title: HEVN 2FA Balance API
  description: Backend API for HEVN mobile neobank
  version: 0.1.2
servers:
- url: https://api.hevn.finance
  description: Production
tags:
- name: Balance
paths:
  /api/v1/balance:
    get:
      tags:
      - Balance
      summary: Get wallet balances
      description: Get OMNI, NEAR, EVM and Swipelux wallet balances for authenticated user.
      operationId: get_balances_api_v1_balance_get
      security:
      - HTTPBearer: []
      parameters:
      - name: wallet_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/WalletType'
          - type: 'null'
          title: Wallet Type
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/balance/withdraw_onchain:
    post:
      tags:
      - Balance
      summary: Withdraw to onchain address
      description: Send funds from Swipelux custodial wallet to external onchain address.
      operationId: withdraw_onchain_api_v1_balance_withdraw_onchain_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawOnchainRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/balance/sweep:
    post:
      tags:
      - Balance
      summary: Sweep custodial balance
      description: Withdraw all funds from Swipelux custodial wallet to user's Base smart wallet.
      operationId: sweep_custodial_api_v1_balance_sweep_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/balance/transaction/status/{quote_id}:
    get:
      tags:
      - Balance
      summary: Get transaction status
      description: Check status of any transaction by quote_id.
      operationId: get_transaction_status_api_v1_balance_transaction_status__quote_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: quote_id
        in: path
        required: true
        schema:
          type: string
          title: Quote Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversalTransactionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/balance/oneclick/tokens:
    get:
      tags:
      - Balance
      summary: Get supported tokens for cross-chain swaps
      description: Get list of tokens supported by 1click for cross-chain swaps.
      operationId: get_oneclick_tokens_api_v1_balance_oneclick_tokens_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/balance/payin/quote:
    post:
      tags:
      - Balance
      summary: Get cross-chain payin quote
      description: Create a quote to deposit from any chain to Base USDC.
      operationId: create_payin_quote_api_v1_balance_payin_quote_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayinQuoteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversalQuoteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/balance/payin/submit:
    post:
      tags:
      - Balance
      summary: Submit cross-chain payin
      description: Materialize a 1click PAYIN row by deposit address. The quote is re-fetched from /v0/status (no quote state is kept on the backend). Status, origin_tx_hash and destination_tx_hash get filled in by the background 1click explorer sync once the deposit lands.
      operationId: submit_payin_api_v1_balance_payin_submit_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayinSubmitRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/balance/payout/quote:
    post:
      tags:
      - Balance
      summary: Get payout quote
      description: Get quote for payout to contact. Auto-detects payment channel (IBAN/onchain/internal).
      operationId: get_payout_quote_api_v1_balance_payout_quote_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutQuoteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversalQuoteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/balance/payout/quote/dry_run:
    post:
      tags:
      - Balance
      summary: Estimate payout quote
      description: Estimate payout amount and fees without a contact or provider-side activation.
      operationId: dry_run_payout_quote_api_v1_balance_payout_quote_dry_run_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutQuoteDryRunRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutQuoteDryRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/balance/payout/quote/submit:
    post:
      tags:
      - Balance
      summary: Activate payout quote
      description: Activate a payout quote and create pending records. Returns deposit address.
      operationId: submit_payout_quote_api_v1_balance_payout_quote_submit_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPayoutQuoteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitPayoutQuoteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/wallet/balance:
    get:
      tags:
      - Balance
      summary: Get wallet balances
      description: Get OMNI, NEAR, EVM and Swipelux wallet balances for authenticated user.
      operationId: get_balances_package_alias_api_v1_wallet_balance_get
      security:
      - HTTPBearer: []
      parameters:
      - name: wallet_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/WalletType'
          - type: 'null'
          title: Wallet Type
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
