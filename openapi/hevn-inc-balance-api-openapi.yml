    post:
      tags:
      - Balance
      summary: Activate payout quote
      description: Activate a payout quote and create pending records. Returns deposit address.
      operationId: submit_payout_quote_package_alias_api_v1_wallet_balance_payout_quote_submit_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPayoutQuoteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitPayoutQuoteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    PayoutQuoteRequest:
      properties:
        contactId:
          type: string
          format: uuid
          title: Contactid
        amount:
          type: number
          title: Amount
        swapType:
          $ref: '#/components/schemas/SwapType'
          default: FLEX_INPUT
      type: object
      required:
      - contactId
      - amount
      title: PayoutQuoteRequest
      description: Request for payout quote to contact.
    PayoutQuoteDryRunResponse:
      properties:
        currencyTo:
          type: string
          title: Currencyto
        amountTo:
          type: number
          title: Amountto
        fee:
          anyOf:
          - type: number
          - type: 'null'
          title: Fee
        fixedFee:
          anyOf:
          - type: number
          - type: 'null'
          title: Fixedfee
      type: object
      required:
      - currencyTo
      - amountTo
      title: PayoutQuoteDryRunResponse
      description: Approximate payout quote response without provider-side activation.
    AccountBalancesResponse:
      properties:
        accountId:
          type: string
          title: Accountid
        chainId:
          type: string
          title: Chainid
        walletType:
          $ref: '#/components/schemas/WalletType'
        balanceUsd:
          type: number
          title: Balanceusd
        rawBalance:
          type: string
          title: Rawbalance
        balanceByToken:
          additionalProperties:
            type: string
          type: object
          title: Balancebytoken
        custodial:
          type: boolean
          title: Custodial
          default: false
      type: object
      required:
      - accountId
      - chainId
      - walletType
      - balanceUsd
      - rawBalance
      - balanceByToken
      title: AccountBalancesResponse
    PayoutStatusResponse:
      properties:
        id:
          type: string
          title: Id
        state:
          type: string
          title: State
        fromAmount:
          type: number
          title: Fromamount
        fromCurrency:
          type: string
          title: Fromcurrency
        toAmount:
          type: number
          title: Toamount
        toCurrency:
          type: string
          title: Tocurrency
        maskedIban:
          anyOf:
          - type: string
          - type: 'null'
          title: Maskediban
      type: object
      required:
      - id
      - state
      - fromAmount
      - fromCurrency
      - toAmount
      - toCurrency
      title: PayoutStatusResponse
      description: Response with payout status.
    UniversalQuoteResponse:
      properties:
        quoteId:
          type: string
          title: Quoteid
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        paymentChannel:
          type: string
          title: Paymentchannel
        fromAmount:
          type: number
          title: Fromamount
        fromCurrency:
          type: string
          title: Fromcurrency
        toAmount:
          type: number
          title: Toamount
        depositMemo:
          anyOf:
          - type: string
          - type: 'null'
          title: Depositmemo
        toCurrency:
          type: string
          title: Tocurrency
        feeAmount:
          anyOf:
          - type: number
          - type: 'null'
          title: Feeamount
        feeCurrency:
          anyOf:
          - type: string
          - type: 'null'
          title: Feecurrency
        rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Rate
        expiresAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expiresat
        maskedIban:
          anyOf:
          - type: string
          - type: 'null'
          title: Maskediban
        depositAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Depositaddress
        recipientAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Recipientaddress
        originChainId:
          anyOf:
          - type: string
          - type: 'null'
          title: Originchainid
        destinationChainId:
          anyOf:
          - type: string
          - type: 'null'
          title: Destinationchainid
        transactionRequest:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Transactionrequest
      type: object
      required:
      - quoteId
      - paymentChannel
      - fromAmount
      - fromCurrency
      - toAmount
      - toCurrency
      title: UniversalQuoteResponse
      description: Universal quote response.
    WithdrawOnchainRequest:
      properties:
        amount:
          type: number
          title: Amount
        currency:
          type: string
          title: Currency
          default: USDC
      type: object
      required:
      - amount
      title: WithdrawOnchainRequest
      description: Request to withdraw from Swipelux wallet to onchain address.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WalletType:
      type: string
      enum:
      - omni
      - base-main
      - swipelux
      - mcp
      - base-aa-wallet
      - wirex
      title: WalletType
    SubmitPayoutQuoteRequest:
      properties:
        quoteId:
          type: string
          title: Quoteid
        contactId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Contactid
        bankAccountId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Bankaccountid
        amount:
          anyOf:
          - type: number
          - type: 'null'
          title: Amount
        destinationChainId:
          anyOf:
          - type: string
          - type: 'null'
          title: Destinationchainid
        toCurrency:
          anyOf:
          - type: string
          - type: 'null'
          title: Tocurrency
      type: object
      required:
      - quoteId
      title: SubmitPayoutQuoteRequest
      description: Request to activate a payout quote.
    SubmitPayoutQuoteResponse:
      properties:
        transferId:
          type: string
          title: Transferid
        status:
          type: string
          title: Status
        depositAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Depositaddress
        depositAmount:
          anyOf:
          - type: string
          - type: 'null'
          title: Depositamount
        quoteId:
