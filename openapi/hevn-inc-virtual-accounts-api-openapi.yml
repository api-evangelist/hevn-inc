          type: string
          title: Currency
          description: ISO 4217 fiat currency code received through this payment method.
        method:
          $ref: '#/components/schemas/FiatPaymentType'
          description: Payment network or method represented by this rail.
        opened:
          type: boolean
          title: Opened
          description: Whether receiving details have been provisioned for this payment method.
        status:
          anyOf:
          - $ref: '#/components/schemas/RailStatus'
          - type: 'null'
          description: Current virtual-account lifecycle status.
        feeBps:
          type: integer
          title: Feebps
          description: Variable fee in basis points; 100 basis points equals 1 percent.
        supportedAccounts:
          items:
            $ref: '#/components/schemas/AccountKey'
          type: array
          title: Supportedaccounts
          description: Accounts this payment method can settle to.
        destinationAccount:
          anyOf:
          - $ref: '#/components/schemas/AccountKey'
          - type: 'null'
          description: Account credited on settlement.
        minimumDeposit:
          anyOf:
          - type: string
            example: '500.00'
          - type: 'null'
          title: Minimumdeposit
          description: Minimum amount accepted through this method.
        id:
          anyOf:
          - type: string
            pattern: ^(?:bnk_)?[A-Za-z0-9._:\-]{1,216}$
            examples:
            - bnk_9f2c1ab84d7e4f1fa3c65b0e7d9a2c41
          - type: 'null'
          title: Id
          description: Opened virtual-account identifier.
        requisites:
          anyOf:
          - $ref: '#/components/schemas/RailRequisitesView'
          - type: 'null'
          description: Receiving details, present after the virtual account becomes active.
      type: object
      required:
      - rail
      - currency
      - method
      - opened
      - feeBps
      - supportedAccounts
      title: RailView
    AccountKey:
      type: string
      enum:
      - USDC
      - EURC
      - FDIC_USD
      title: AccountKey
    RailKycStatus:
      type: string
      enum:
      - notStarted
      - requested
      - incorporating
      - pending
      - underReview
      - documentRequested
      - approved
      - rejected
      title: RailKycStatus
    RequisiteHolder-Output:
      properties:
        type:
          $ref: '#/components/schemas/RequisiteHolderType'
          description: Whether the account holder is an individual or a business.
        firstName:
          anyOf:
          - type: string
          - type: 'null'
          title: Firstname
          description: Legal given name of an individual holder.
        lastName:
          anyOf:
          - type: string
          - type: 'null'
          title: Lastname
          description: Legal family name of an individual holder.
        businessName:
          anyOf:
          - type: string
          - type: 'null'
          title: Businessname
          description: Registered legal name of a business holder.
        address:
          anyOf:
          - $ref: '#/components/schemas/UserAddress'
          - type: 'null'
          description: Postal address of the account holder.
        idType:
          anyOf:
          - $ref: '#/components/schemas/RequisiteIdType'
          - type: 'null'
          description: Government identifier type for the holder.
        idNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Idnumber
          description: Government identifier number for the holder.
        taxId:
          anyOf:
          - type: string
          - type: 'null'
          title: Taxid
          description: Tax identifier of the holder.
        nationality:
          anyOf:
          - type: string
          - type: 'null'
          title: Nationality
          description: ISO country code of the holder's nationality.
      type: object
      required:
      - type
      title: RequisiteHolder
    RailRequisitesView:
      properties:
        fields:
          $ref: '#/components/schemas/RequisiteFields'
          description: Structured receiving details for this payment method.
        holder:
          $ref: '#/components/schemas/RequisiteHolder-Output'
          description: Identity and address of the receiving account holder.
        bankName:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankname
          description: Name of the receiving financial institution.
        paymentReference:
          anyOf:
          - type: string
          - type: 'null'
          title: Paymentreference
          description: Reference or memo that must accompany the account transfer.
        state:
          $ref: '#/components/schemas/RequisiteState'
          description: Current usability state of the receiving details.
      type: object
      required:
      - fields
      - holder
      - state
      title: RailRequisitesView
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
